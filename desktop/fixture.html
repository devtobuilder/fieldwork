<!doctype html><html><head><meta charset="utf-8"><title>Dynamic application fixture</title><style>body{font:16px system-ui;background:#fafbf8;color:#1d3027;max-width:660px;margin:45px auto}label{display:block;margin:22px 0}input,select,textarea,[role=combobox]{padding:13px;border:1px solid #bcc9c0;border-radius:8px;display:block;width:90%;font:inherit;background:white}#menu{background:white;border:1px solid #ccc;padding:8px;position:absolute;width:300px}#menu div{padding:14px;cursor:pointer}button{padding:14px 24px;background:#23583d;color:white;border:0;border-radius:8px}small{color:#6b796f}</style></head><body><small>LOCAL FIXTURE · no employer receives this data</small><h1>Software engineer</h1><p>Complete your candidate information.</p><form id="application"><label>Full name<input name="full_name" required></label><label>Email address<input name="email" type="email" required></label><label>Portfolio URL<input name="portfolio"></label><label>Citizenship<select name="citizenship"><option value="">Choose</option><option value="US">United States</option><option value="other">Other</option></select></label><label>Preferred work arrangement<div id="custom" role="combobox" tabindex="0" aria-expanded="false">Choose an arrangement</div></label><div id="portal"></div><label>Additional information<textarea name="notes"></textarea></label><button type="submit">Submit application</button><p id="result"></p></form><script>const custom=document.getElementById('custom');custom.onclick=()=>{custom.setAttribute('aria-expanded','true');setTimeout(()=>{document.getElementById('portal').innerHTML='<div id="menu"><div>Remote</div><div>Hybrid</div><div>On-site</div></div>';for(const option of document.querySelectorAll('#menu div'))option.onclick=()=>{custom.textContent=option.textContent;custom.setAttribute('aria-expanded','false');document.getElementById('portal').innerHTML=''}},450)};document.querySelector('form').onsubmit=e=>{e.preventDefault();document.getElementById('result').textContent='Fixture application received';localStorage.setItem('fixture-submitted','yes')};</script></body></html>
